<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — CreatiHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="stylesheet" href="/css/style.css">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div class="container">
  <div class="dash">
    <aside class="dash-side">
      <div class="dash-side-head">
        <div class="logo" style="font-size:1.15rem">✦ <span>Admin</span></div>
        <div class="bell-wrap" id="bellWrap" title="Notifications">
          🔔<span class="bell-badge" id="bellBadge">0</span>
        </div>
      </div>
      <a href="#overview" class="active" data-view="overview">📊 Overview</a>
      <a href="#activity" data-view="activity">⚡ Live Activity</a>
      <a href="#notifications" data-view="notifications">🔔 Notifications <span class="bell-badge" id="navBadge" style="position:static;margin-left:4px;display:none"></span></a>
      <a href="#pricing" data-view="pricing">💲 Pricing & Services</a>
      <a href="#customers" data-view="customers">👥 Customers</a>
      <a href="#orders" data-view="orders">📦 Orders & Delivery</a>
      <a href="#reviews" data-view="reviews">⭐ Reviews</a>
      <a href="#coupons" data-view="coupons">🎟️ Coupons</a>
      <a href="#subs" data-view="subs">🔁 Subscriptions</a>
      <a href="#training" data-view="training">🎓 Training Academy</a>
      <a href="#broadcast" data-view="broadcast">📧 Email Broadcast</a>
      <a href="#security" data-view="security">🔒 Security & Access</a>
      <a href="#data" data-view="data">💾 Data & Backups</a>
      <a href="#aisafety" data-view="aisafety">🛡️ AI Safety</a>
      <a href="#ai" data-view="ai">🤖 Nova AI Insights</a>
    </aside>
    <main class="dash-main" id="dashMain"><div class="empty">Loading…</div></main>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
renderNav('admin');
renderFooter();

const user = API.user();
if (!user) location.href = '/auth?next=' + encodeURIComponent('/admin');
else if (user.role !== 'admin') location.href = '/dashboard';

const main = document.getElementById('dashMain');
const sideLinks = document.querySelectorAll('.dash-side a');
let view = location.hash.slice(1) || 'overview';

sideLinks.forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  view = a.dataset.view;
  location.hash = view;
  renderView();
}));

document.getElementById('bellWrap').addEventListener('click', () => {
  view = 'notifications'; location.hash = view; renderView();
});

function renderView() {
  stopPolling();
  sideLinks.forEach(a => a.classList.toggle('active', a.dataset.view === view));
  if (view === 'overview') return renderOverview();
  if (view === 'activity') return renderActivity();
  if (view === 'notifications') return renderNotifications();
  if (view === 'pricing') return renderPricing();
  if (view === 'customers') return renderCustomers();
  if (view === 'orders') return renderOrdersAdmin();
  if (view === 'reviews') return renderReviewsAdmin();
  if (view === 'coupons') return renderCouponsAdmin();
  if (view === 'subs') return renderSubsAdmin();
  if (view === 'training') return renderTrainingAdmin();
  if (view === 'broadcast') return renderBroadcast();
  if (view === 'security') return renderSecurity();
  if (view === 'data') return renderData();
  if (view === 'aisafety') return renderAiSafety();
  if (view === 'ai') return renderAI();
}

/* ============================================================ SHARED ============================================================ */
const ACT_ICONS = {
  support: '💬', recommendation: '🎨', analytics: '📊', order_help: '📦',
  faq: '❓', greeting: '👋', blocked: '🚫'
};
const NOTIF_ICONS = { order: '📦', payment: '💳', support: '💬', security: '🔒', pricing: '💲', system: '⚙️' };
let pollTimer = null;
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function refreshBell() {
  try {
    const n = await API.get('/admin/notifications');
    const u = n.unread;
    const badge = document.getElementById('bellBadge');
    const navBadge = document.getElementById('navBadge');
    badge.textContent = u; badge.classList.toggle('show', u > 0);
    navBadge.textContent = u; navBadge.style.display = u > 0 ? 'inline-flex' : 'none';
  } catch (e) {}
}
setInterval(refreshBell, 8000);
refreshBell();

/* ============================================================ OVERVIEW ============================================================ */
async function renderOverview() {
  main.innerHTML = '<div class="page-head"><h2>📊 Business Overview</h2></div><div class="empty">Loading analytics…</div>';
  try {
    const s = await API.get('/admin/stats');
    const act = await API.get('/admin/ai-activity');
    let subStats = { stats: { active: 0, monthlyRecurringRevenue: 0, total: 0 } };
    try { subStats = await API.get('/admin/subscriptions'); } catch {}
    const days = Object.entries(s.byDay);
    const maxDay = Math.max(...days.map(d => d[1]), 1);
    const svcEntries = Object.entries(s.byService).sort((a, b) => b[1].revenue - a[1].revenue);
    const maxSvc = Math.max(...svcEntries.map(x => x[1].revenue), 1);
    const aiByType = {};
    act.activity.forEach(a => { aiByType[a.type] = (aiByType[a.type] || 0) + 1; });
    main.innerHTML = `
      <div class="page-head"><h2>📊 Business Overview</h2><button class="btn btn-ghost btn-sm" onclick="renderOverview()">↻ Refresh</button></div>
      <div class="stats-strip" style="margin-bottom:24px">
        <div class="stat-box"><div class="num">$${s.revenue.toLocaleString()}</div><div class="lbl">Total Revenue</div></div>
        <div class="stat-box"><div class="num">$${(subStats.stats.monthlyRecurringRevenue||0).toLocaleString()}</div><div class="lbl">Monthly Recurring (MRR)</div></div>
        <div class="stat-box"><div class="num">${s.totalOrders}</div><div class="lbl">Total Orders</div></div>
        <div class="stat-box"><div class="num">${subStats.stats.active||0}</div><div class="lbl">Active Subscriptions</div></div>
        <div class="stat-box"><div class="num">${s.customers}</div><div class="lbl">Customers</div></div>
        <div class="stat-box"><div class="num">${act.total}</div><div class="lbl">AI Tasks Performed</div></div>
      </div>
      <div class="panel" style="margin-bottom:20px">
        <h3>⚡ Latest AI Activity <a href="#activity" onclick="view='activity';renderView()" style="float:right;font-size:.82rem;color:var(--accent)">View live feed →</a></h3>
        <div class="feed-list" style="max-height:240px">
          ${act.activity.slice(0,5).map(a => `
            <div class="feed-item">
              <div class="feed-ico ${a.type}">${ACT_ICONS[a.type] || '🤖'}</div>
              <div class="feed-body">
                <div class="fhead"><span class="faction">${esc(a.action)}</span><span class="ftime">${timeAgo(a.at)}</span></div>
                <div class="factor">by ${esc(a.actor)}</div>
              </div>
            </div>`).join('') || '<p style="color:var(--muted)">No AI activity yet. Nova will appear here as it works.</p>'}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px" class="ov-grid">
        <div class="panel">
          <h3>💰 Revenue — Last 7 Days</h3>
          <div class="bar-chart">
            ${days.map(([d, v]) => `
              <div class="bar-col">
                <div class="bar" style="height:${Math.max((v / maxDay) * 100, 3)}%"><span class="val">$${v}</span></div>
                <div class="bar-lbl">${new Date(d).toLocaleDateString(undefined, { weekday: 'short' })}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="panel">
          <h3>📦 Orders by Status</h3>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
            <div class="stat-box" style="flex:1;padding:18px"><div class="num" style="color:var(--warn);-webkit-text-fill-color:var(--warn)">${s.byStatus.pending || 0}</div><div class="lbl">Pending</div></div>
            <div class="stat-box" style="flex:1;padding:18px"><div class="num" style="color:var(--accent);-webkit-text-fill-color:var(--accent)">${s.byStatus.in_progress || 0}</div><div class="lbl">In Progress</div></div>
            <div class="stat-box" style="flex:1;padding:18px"><div class="num" style="color:var(--accent2);-webkit-text-fill-color:var(--accent2)">${s.byStatus.completed || 0}</div><div class="lbl">Completed</div></div>
          </div>
          <h3 class="mt-3">🏆 Revenue by Service</h3>
          <div class="mt-2">
            ${svcEntries.slice(0, 5).map(([name, d]) => `
              <div class="hbar-row">
                <span class="nm">${esc(name)}</span>
                <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max((d.revenue / maxSvc) * 100, 8)}%">$${d.revenue}</div></div>
              </div>`).join('') || '<p style="color:var(--muted)">No data yet.</p>'}
          </div>
        </div>
      </div>`;
  } catch (e) {
    main.innerHTML = '<div class="empty">Failed to load stats: ' + esc(e.message) + '</div>';
  }
}

/* ============================================================ LIVE ACTIVITY (real-time AI feed) ============================================================ */
let actFilter = 'all';
let lastActTime = null;
async function renderActivity() {
  main.innerHTML = `
    <div class="page-head"><h2>⚡ Live AI Activity</h2><div class="live-tag"><span class="live-dot"></span>Live · auto-refresh 5s</div></div>
    <p style="color:var(--muted);margin-bottom:18px;max-width:720px">Watch Nova work in real time. Every support reply, recommendation, analytics task and safety block appears here the moment it happens.</p>
    <div class="feed-toolbar">
      <div class="feed-type-filter" id="actFilter">
        <button class="active" data-f="all">All</button>
        <button data-f="support">💬 Support</button>
        <button data-f="recommendation">🎨 Recommendations</button>
        <button data-f="analytics">📊 Analytics</button>
        <button data-f="order_help">📦 Orders</button>
        <button data-f="blocked">🚫 Blocked</button>
      </div>
      <span id="actCount" style="color:var(--muted);font-size:.85rem"></span>
    </div>
    <div class="feed-list" id="actList"><div class="empty">Loading live activity…</div></div>`;
  lastActTime = null;
  document.querySelectorAll('#actFilter button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#actFilter button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    actFilter = b.dataset.f;
    lastActTime = null;
    pollActivity();
  }));
  pollActivity();
  pollTimer = setInterval(pollActivity, 5000);
}
async function pollActivity() {
  try {
    const url = lastActTime ? '/admin/ai-activity?since=' + encodeURIComponent(lastActTime) : '/admin/ai-activity';
    const res = await API.get(url);
    lastActTime = res.serverTime;
    const list = document.getElementById('actList');
    if (!list) return;
    const all = res.activity;
    const items = actFilter === 'all' ? all : all.filter(a => a.type === actFilter);
    document.getElementById('actCount').textContent = res.total + ' total AI tasks';
    if (!items.length && !list.querySelector('.feed-item')) {
      list.innerHTML = '<div class="empty"><div class="big">🤖</div>Nova is idle right now.<br>New activity will appear here automatically.</div>';
      return;
    }
    // Prepend only genuinely new items
    const existingIds = new Set([...list.querySelectorAll('.feed-item')].map(el => el.dataset.id));
    const newOnes = items.filter(a => !existingIds.has(a.id));
    if (newOnes.length) {
      const frag = document.createElement('div');
      frag.innerHTML = newOnes.map(a => `
        <div class="feed-item new" data-id="${a.id}">
          <div class="feed-ico ${a.type}">${ACT_ICONS[a.type] || '🤖'}</div>
          <div class="feed-body">
            <div class="fhead"><span class="faction">${esc(a.action)}</span><span class="ftime">${timeAgo(a.at)}</span></div>
            <div class="factor">by ${esc(a.actor)}</div>
            <div class="fdetail">${esc(a.detail)}</div>
          </div>
        </div>`).join('');
      [...frag.children].reverse().forEach(c => list.insertBefore(c, list.firstChild));
      // Trim to 100
      [...list.querySelectorAll('.feed-item')].slice(100).forEach(el => el.remove());
      // remove placeholder
      const empty = list.querySelector('.empty'); if (empty) empty.remove();
    }
  } catch (e) {}
}

/* ============================================================ NOTIFICATIONS ============================================================ */
async function renderNotifications() {
  main.innerHTML = '<div class="page-head"><h2>🔔 Notifications</h2></div><div class="empty">Loading…</div>';
  try {
    const n = await API.get('/admin/notifications');
    main.innerHTML = `
      <div class="page-head"><h2>🔔 Notifications</h2><button class="btn btn-ghost btn-sm" id="markAllBtn">✓ Mark all read</button></div>
      <div class="panel" style="padding:0;overflow:hidden">
        ${n.notifications.length ? n.notifications.map(item => `
          <div class="notif-item ${item.read ? '' : 'unread'}" data-id="${item.id}">
            <div class="notif-ico">${NOTIF_ICONS[item.type] || '🔔'}</div>
            <div class="notif-body">
              <div class="ntitle">${esc(item.title)}</div>
              <div class="nmsg">${esc(item.message)}</div>
              <div class="ntime">${timeAgo(item.at)}${item.read ? '' : ' · <b style="color:var(--accent)">unread</b>'}</div>
            </div>
          </div>`).join('') : '<div class="empty"><div class="big">🔕</div>No notifications yet.<br>You\'ll be alerted here for orders, payments, support messages, price changes and security events.</div>'}
      </div>`;
    document.getElementById('markAllBtn').addEventListener('click', async () => {
      try { await API.post('/admin/notifications/read-all'); toast('All notifications marked read'); refreshBell(); renderNotifications(); }
      catch (e) { toast('Error: ' + e.message); }
    });
    main.querySelectorAll('.notif-item').forEach(el => el.addEventListener('click', async () => {
      if (el.classList.contains('unread')) {
        try { await API.put('/admin/notifications/' + el.dataset.id + '/read'); el.classList.remove('unread'); refreshBell(); }
        catch (e) {}
      }
    }));
    refreshBell();
  } catch (e) {
    main.innerHTML = '<div class="empty">Failed to load notifications.</div>';
  }
}

/* ============================================================ PRICING & SERVICES ============================================================ */
let priceServices = [];
async function renderPricing() {
  main.innerHTML = '<div class="page-head"><h2>💲 Pricing & Services</h2></div><div class="empty">Loading services…</div>';
  try {
    const data = await API.get('/admin/services');
    priceServices = JSON.parse(JSON.stringify(data.services)); // deep clone for editing
    main.innerHTML = `
      <div class="page-head"><h2>💲 Pricing & Services</h2><span style="color:var(--muted);font-size:.9rem">${priceServices.length} services</span></div>
      <p style="color:var(--muted);margin-bottom:20px;max-width:720px">Edit the price of any package (Basic / Standard / Premium) to reduce or raise your service prices. Changes go live instantly for all customers. Every change is recorded in the price history.</p>
      <div id="priceList"></div>
      <div class="panel mt-3">
        <h3>📜 Price Change History</h3>
        <div id="priceHist"><div style="color:var(--muted);font-size:.88rem;padding:8px 0">Loading…</div></div>
      </div>`;
    renderPriceCards();
    loadPriceHistory();
  } catch (e) {
    main.innerHTML = '<div class="empty">Failed to load services: ' + esc(e.message) + '</div>';
  }
}
function renderPriceCards() {
  const wrap = document.getElementById('priceList');
  wrap.innerHTML = priceServices.map(svc => `
    <div class="price-svc-card">
      <div class="price-svc-head">
        <span class="pico">${svc.icon}</span>
        <h3>${esc(svc.name)}</h3>
        <span class="badge" style="background:rgba(108,92,231,.15);color:var(--primary2)">${esc(svc.category)}</span>
      </div>
      ${svc.packages.map(pkg => `
        <div class="price-pkg-row" data-svc="${svc.id}" data-pkg="${pkg.id}">
          <div class="price-pkg-name">${esc(pkg.name)}</div>
          <div class="price-pkg-desc">${esc(pkg.desc)}</div>
          <div class="price-input-wrap">
            <span class="cur">$</span>
            <input class="price-input" type="number" min="0" step="0.01" value="${pkg.price}" data-orig="${pkg.price}">
            <span class="price-delta" data-delta></span>
          </div>
          <button class="price-save-btn" disabled>Save</button>
        </div>`).join('')}
      <div class="discount-bar">
        <span style="color:var(--muted);font-size:.85rem">Quick discount:</span>
        <select class="disc-pct">
          <option value="10">10% off</option><option value="15">15% off</option>
          <option value="20">20% off</option><option value="25">25% off</option>
          <option value="30">30% off</option><option value="40">40% off</option><option value="50">50% off</option>
        </select>
        <button class="btn btn-primary btn-sm disc-btn" data-svc="${svc.id}">Apply to all packages</button>
      </div>
    </div>`).join('');
  // wire up price inputs
  wrap.querySelectorAll('.price-pkg-row').forEach(row => {
    const input = row.querySelector('.price-input');
    const delta = row.querySelector('[data-delta]');
    const btn = row.querySelector('.price-save-btn');
    const orig = parseFloat(input.dataset.orig);
    input.addEventListener('input', () => {
      const val = parseFloat(input.value);
      if (isNaN(val) || val === orig) {
        input.classList.remove('changed'); delta.textContent = ''; btn.classList.remove('ready'); btn.disabled = true; return;
      }
      input.classList.add('changed'); btn.classList.add('ready'); btn.disabled = false;
      const diff = val - orig;
      delta.className = 'price-delta ' + (diff < 0 ? 'down' : 'up');
      delta.textContent = diff < 0 ? `▼ $${Math.abs(diff).toFixed(2)}` : `▲ $${diff.toFixed(2)}`;
    });
    btn.addEventListener('click', async () => {
      const val = parseFloat(input.value);
      if (isNaN(val) || val < 0) { toast('Enter a valid price'); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await API.put('/admin/services/' + row.dataset.svc + '/packages/' + row.dataset.pkg, { price: val });
        input.dataset.orig = val; input.value = val; input.classList.remove('changed');
        delta.textContent = ''; btn.classList.remove('ready'); btn.textContent = 'Saved ✓';
        toast(`Price updated: ${res.package.name} → $${val}`);
        setTimeout(() => { btn.textContent = 'Save'; }, 1800);
      } catch (e) { toast('Error: ' + e.message); btn.textContent = 'Save'; btn.disabled = false; }
    });
  });
  // wire up discount buttons
  wrap.querySelectorAll('.disc-btn').forEach(btn => btn.addEventListener('click', async () => {
    const card = btn.closest('.price-svc-card');
    const pct = card.querySelector('.disc-pct').value;
    if (!confirm(`Apply ${pct}% discount to ALL packages of this service?`)) return;
    btn.disabled = true; btn.textContent = 'Applying…';
    try {
      const res = await API.post('/admin/services/' + btn.dataset.svc + '/discount', { percent: pct });
      toast(`${pct}% discount applied!`);
      // update inputs to reflect new prices
      res.service.packages.forEach(p => {
        const row = card.querySelector(`.price-pkg-row[data-pkg="${p.id}"]`);
        const inp = row.querySelector('.price-input');
        inp.value = p.price; inp.dataset.orig = p.price; inp.classList.remove('changed');
        row.querySelector('[data-delta]').textContent = '';
        row.querySelector('.price-save-btn').classList.remove('ready');
      });
      btn.disabled = false; btn.textContent = 'Apply to all packages';
      loadPriceHistory();
    } catch (e) { toast('Error: ' + e.message); btn.disabled = false; btn.textContent = 'Apply to all packages'; }
  }));
}
async function loadPriceHistory() {
  const el = document.getElementById('priceHist');
  if (!el) return;
  try {
    const h = await API.get('/admin/price-history');
    el.innerHTML = h.history.length ? h.history.map(p => `
      <div class="price-hist-item">
        <span><b>${esc(p.serviceName)}</b> · ${esc(p.packageName)}</span>
        <span><span class="ph-old">$${p.oldPrice}</span> → <span class="ph-new">$${p.newPrice}</span> <small style="color:var(--muted)">by ${esc(p.by)} · ${timeAgo(p.at)}</small></span>
      </div>`).join('') : '<div style="color:var(--muted);font-size:.88rem;padding:8px 0">No price changes yet.</div>';
  } catch (e) {}
}

/* ============================================================ CUSTOMERS ============================================================ */

        <table class="tbl">

          <tbody>
            ${customers.map(u => `
              <tr>
                <td><div class="flex"><div class="tst-user"><div class="av" style="width:34px;height:34px;font-size:.85rem">${esc(u.name[0] || '?')}</div></div><b>${esc(u.name)}</b></div></td>
                <td style="color:var(--muted)">${esc(u.email)}</td>

/* ============================================================ ORDERS & DELIVERY ============================================================ */
const STATUS_COLORS = { awaiting_payment:'#6b7280', pending:'#d97706', in_progress:'#2563eb', completed:'#16a34a', cancelled:'#dc2626' };
let ordersFilter = 'all';

async function renderOrdersAdmin() {
  main.innerHTML = '<div class="page-head"><h2>📦 Orders & Delivery</h2></div><div class="empty">Loading orders…</div>';
  try {
    const { orders } = await API.get('/admin/orders');
    const cfg = await API.get('/config').catch(() => ({}));
    const mode = cfg.generatorMode || 'not_configured';
    const prov = (cfg.generator && cfg.generator.providers) || {};
    let modeLabel, modeColor;
    if (mode === 'live') {
      if (prov.gemini && prov.openai) { modeLabel = 'Live (Gemini + OpenAI)'; modeColor = '#16a34a'; }
      else if (prov.openai) { modeLabel = 'Live (OpenAI)'; modeColor = '#16a34a'; }
      else if (prov.gemini) { modeLabel = 'Live (Gemini)'; modeColor = '#2563eb'; }
      else { modeLabel = 'Live'; modeColor = '#16a34a'; }
    } else {
      modeLabel = 'Not Configured'; modeColor = '#dc2626';
    }
    main.innerHTML = `
      <div class="page-head"><h2>📦 Orders & Delivery</h2>
        <span style="color:var(--muted);font-size:.85rem">AI engine: <b style="color:${modeColor}">${esc(modeLabel)}</b></span>
      </div>
      <div class="stats-strip" style="margin-bottom:16px">

          <div style="margin-top:8px;font-size:.9rem"><b>Brief:</b> ${esc((o.requirements||'').slice(0,180))}${(o.requirements||'').length>180?'…':''}</div>

function renderDeliverablesAdmin(o) {

function fileIcon(kind) {

async function adminUpdateStatus(id) {

async function adminGenerate(id, btn) {

// Admin revision panel — shows pending revision requests on order cards
function renderAdminRevisionPanel(o) {
  const revisions = o.revisions || [];
  if (!revisions.length) return '';
  const pending = revisions.filter(r => r.status === 'pending' || r.status === 'open');
  const others = revisions.filter(r => r.status !== 'pending' && r.status !== 'open');
  if (!pending.length && !others.length) return '';
  return `
    <div class="admin-rev-panel" style="${pending.length ? '' : 'border-color:var(--border);background:var(--bg)'}">
      <h4>🔄 Revision Requests (${revisions.length})</h4>
      ${pending.map(r => `
        <div class="admin-rev-item">
          <div class="rev-meta">Requested ${new Date(r.requestedAt || r.at).toLocaleString()}</div>
          <div class="rev-note">"${esc(r.note || '')}"</div>
          <div class="rev-btns">
            <button class="btn btn-sm btn-primary" onclick="adminRevAction('${o.id}','${r.id}','accept_regenerate')">✅ Accept & Regenerate</button>
            <button class="btn btn-sm btn-ghost" onclick="adminRevAction('${o.id}','${r.id}','reject')">Reject</button>
          </div>
          <div id="revResp_${r.id}" style="margin-top:6px">
            <input type="text" class="inp" id="revRespTxt_${r.id}" placeholder="Optional response note to customer..." style="width:100%;font-size:.85rem;padding:6px 8px;margin-top:4px">
          </div>
        </div>
      `).join('')}
      ${others.length ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-size:.8rem;color:var(--muted)">${others.length} resolved request${others.length>1?'s':''}</summary>
        <div style="margin-top:6px">${others.map(r => `
          <div class="admin-rev-item" style="opacity:.75">
            <div class="rev-meta">${new Date(r.requestedAt||r.at).toLocaleDateString()} — <b style="text-transform:capitalize">${esc(r.status)}</b></div>
            <div class="rev-note">"${esc(r.note||'')}"</div>
            ${r.response ? `<div style="font-size:.8rem;color:var(--muted)">Response: ${esc(r.response)}</div>` : ''}
          </div>`).join('')}
        </div></details>` : ''}
    </div>`;
}

async function adminRevAction(orderId, revId, action) {
  const respInput = document.getElementById('revRespTxt_' + revId);
  const response = respInput ? respInput.value.trim() : '';
  let status = '';
  let note = '';
  if (action === 'accept_regenerate') {
    status = 'accepted';
    note = response || 'Revision accepted — regenerating your deliverables now.';
  } else if (action === 'reject') {
    status = 'rejected';
    note = response || prompt('Reason for rejecting this revision:', 'We are unable to accommodate this request.') || '';
  }
  if (!confirm(action === 'accept_regenerate' ? 'Accept this revision and regenerate deliverables now?' : 'Reject this revision request?')) return;
  try {
    const r = await API.put('/admin/orders/' + orderId + '/revisions/' + revId, { status, response: note, regenerate: action === 'accept_regenerate' });
    toast(r.revision ? 'Revision ' + r.revision.status : 'Revision updated');
    renderOrdersAdmin();
  } catch (e) {
    alert('Failed: ' + e.message);
  }
}

async function renderCouponsAdmin() {
  main.innerHTML = '<div class="page-head"><h2>🎟️ Coupon Codes</h2></div><div class="empty">Loading…</div>';
  try {
    const { coupons } = await API.get('/admin/coupons');

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px" class="coupon-form-grid">
          <div class="field"><label>Coupon Code</label><input id="cpCode" placeholder="SAVE20" style="text-transform:uppercase"></div>
          <div class="field"><label>Discount %</label><input id="cpPct" type="number" min="1" max="100" placeholder="20"></div>

      <style>@media(max-width:860px){.coupon-form-grid{grid-template-columns:1fr 1fr!important}}@media(max-width:560px){.coupon-form-grid{grid-template-columns:1fr!important}}</style>`;

  } catch (e) {

function renderCouponCards(coupons) {
  if (!coupons.length) return '<div class="empty"><div class="big">🎟️</div>No coupons yet. Create one above to offer discounts at checkout.</div>';
  return coupons.map(c => {
    const isActive = c.active && (!c.expiresAt || new Date(c.expiresAt) > new Date()) && (!c.maxUses || c.uses < c.maxUses);
    return `
    <div class="coupon-card">
      <div>
        <div class="cp-code">${esc(c.code)}</div>
        <div class="cp-info">${c.discountPct}% off${c.maxUses ? ' · ' + c.uses + '/' + c.maxUses + ' used' : ' · ' + c.uses + ' used'}${c.expiresAt ? ' · expires ' + new Date(c.expiresAt).toLocaleDateString() : ' · no expiry'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="cp-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
        ${c.active ? `<button class="btn btn-ghost btn-sm" onclick="deactivateCoupon('${c.id}')">Deactivate</button>` : '<span style="color:var(--muted);font-size:.78rem">Deactivated</span>'}
      </div>
    </div>`;
  }).join('');
}

async function createCoupon() {
  const code = document.getElementById('cpCode').value.trim().toUpperCase();
  const discountPct = parseInt(document.getElementById('cpPct').value);
  const maxUses = parseInt(document.getElementById('cpMax').value) || 0;
  const expiresAt = document.getElementById('cpExp').value || null;
  const msg = document.getElementById('cpMsg');
  if (!code || !discountPct) { msg.innerHTML = '<div class="form-error">Code and discount percentage are required.</div>'; return; }
  if (discountPct < 1 || discountPct > 100) { msg.innerHTML = '<div class="form-error">Discount must be between 1 and 100%.</div>'; return; }
  msg.innerHTML = '';
  try {
    const r = await API.post('/admin/coupons', { code, discountPct, maxUses, expiresAt });
    msg.innerHTML = '<div class="form-ok">✅ Coupon <b>' + esc(r.coupon.code) + '</b> created!</div>';
    toast('Coupon created!');
    setTimeout(renderCouponsAdmin, 800);
  } catch (e) {
    msg.innerHTML = '<div class="form-error">' + esc(e.message) + '</div>';
  }
}

async function deactivateCoupon(id) {
  if (!confirm('Deactivate this coupon? It will no longer be usable at checkout.')) return;
  try {
    await API.del('/admin/coupons/' + id);
    toast('Coupon deactivated');
    renderCouponsAdmin();
  } catch (e) {
    alert('Failed: ' + e.message);
  }
}

// Download a stored backup file (uses fetch + blob to attach the auth token)
async function downloadBackup(filename) {
  try {
    const data = await API.get('/admin/backups/' + encodeURIComponent(filename));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  } catch (e) { toast('Download failed: ' + e.message); }
}

function wireAiSafety() {
  // master toggle
  const mt = document.getElementById('masterToggle');
  mt.addEventListener('click', () => {
    aiSettings.enabled = !aiSettings.enabled;
    mt.classList.toggle('on', aiSettings.enabled);
    document.querySelector('#killSwitch .ks-ico').textContent = aiSettings.enabled ? '🟢' : '🔴';
    document.querySelector('#killSwitch b').textContent = 'Nova AI is currently ' + (aiSettings.enabled ? 'ENABLED' : 'DISABLED');
    document.querySelector('#killSwitch small').textContent = aiSettings.enabled ? 'Nova is actively serving customers. Toggle off to instantly stop all AI responses.' : 'Nova is offline and will not respond to any visitor messages.';
  });
  // other toggles
  document.querySelectorAll('[data-tgl]').forEach(t => t.addEventListener('click', () => {
    const path = t.dataset.tgl.split('.');
    if (path.length === 2) aiSettings[path[0]][path[1]] = !aiSettings[path[0]][path[1]];
    else aiSettings[path[0]] = !aiSettings[path[0]];
    t.classList.toggle('on');
  }));
  // rate limit desc
  const rlMax = document.getElementById('rlMax'), rlWin = document.getElementById('rlWin');
  const updRl = () => { document.getElementById('rlDesc').textContent = `${rlMax.value} messages / ${rlWin.value} min`; };
  rlMax.addEventListener('input', updRl); rlWin.addEventListener('input', updRl);
  // chips
  // chips — renderChips handles its own removal internally (via the × click
  // handler bound inside it), so we only need the initial render here.
  renderChips('phraseChips', aiSettings.blockedPhrases);
  renderChips('topicChips', aiSettings.blockedTopics);
  document.getElementById('addPhrase').addEventListener('click', () => {
    const inp = document.getElementById('phraseInput'); const v = inp.value.trim();
    if (v && !aiSettings.blockedPhrases.includes(v)) { aiSettings.blockedPhrases.push(v); inp.value = ''; renderChips('phraseChips', aiSettings.blockedPhrases); }
  });
  document.getElementById('addTopic').addEventListener('click', () => {
    const inp = document.getElementById('topicInput'); const v = inp.value.trim();
    if (v && !aiSettings.blockedTopics.includes(v)) { aiSettings.blockedTopics.push(v); inp.value = ''; renderChips('topicChips', aiSettings.blockedTopics); }
  });
  document.getElementById('phraseInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addPhrase').click(); } });
  document.getElementById('topicInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addTopic').click(); } });
  // save
  document.getElementById('saveAiBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveAiBtn');
    aiSettings.rateLimit = { maxMessages: parseInt(rlMax.value, 10) || 20, windowMinutes: parseInt(rlWin.value, 10) || 60 };
    aiSettings.guardrails.maxMessageLength = parseInt(document.getElementById('maxLen').value, 10) || 1000;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving…';
    try {
      await API.put('/admin/ai-settings', { settings: aiSettings });
      toast('AI safety settings saved! Nova is ' + (aiSettings.enabled ? 'enabled' : 'disabled'));
      renderAiSafety();
    } catch (e) { toast('Error: ' + e.message); }
    btn.disabled = false; btn.textContent = '💾 Save Settings';
  });
}
function renderChips(elId, items, onRemove) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = items.map(v => `<span class="chip">${esc(v)}<span class="x" data-v="${esc(v)}">×</span></span>`).join('') || '<span style="color:var(--muted);font-size:.82rem">None yet.</span>';
  el.querySelectorAll('.x').forEach(x => x.addEventListener('click', () => {
    const val = x.dataset.v;
    if (elId === 'phraseChips') aiSettings.blockedPhrases = aiSettings.blockedPhrases.filter(i => i !== val);
    else aiSettings.blockedTopics = aiSettings.blockedTopics.filter(i => i !== val);
    renderChips(elId, elId === 'phraseChips' ? aiSettings.blockedPhrases : aiSettings.blockedTopics);
  }));
}

      </div>

  const sugg = document.getElementById('aiSugg');

  function addMsg(text, who) {
    const d = document.createElement('div');
    d.className = 'chat-msg ' + (who === 'me' ? 'me' : 'bot');
    d.innerHTML = mdLite(text);
    body.appendChild(d); body.scrollTop = body.scrollHeight;
  }
  function setSugg(list) {
    sugg.innerHTML = '';
    (list || []).forEach(s => { const b = document.createElement('button'); b.textContent = s; b.addEventListener('click', () => send(s)); sugg.appendChild(b); });
  }
  async function send(text) {
    if (!text.trim()) return;
    addMsg(text, 'me'); input.value = ''; setSugg([]);
    const typing = document.createElement('div');
    typing.className = 'chat-msg bot typing'; typing.innerHTML = '<i></i><i></i><i></i>';
    body.appendChild(typing); body.scrollTop = body.scrollHeight;
    try {
      const res = await API.post('/admin/chat', { message: text });
      typing.remove(); addMsg(res.reply, 'bot'); setSugg(res.suggestions);
    } catch (e) { typing.remove(); addMsg('Error: ' + e.message, 'bot'); }
  }
  document.getElementById('aiSend').addEventListener('click', () => send(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(input.value); });
  send('hello');
}

  try {
    const [tmplRes, histRes, usersRes] = await Promise.all([
      API.get('/admin/email/templates'),
      API.get('/admin/email/history'),
      API.get('/admin/email/users')
    ]);
    broadcastState.users = usersRes.users || [];
    const templates = tmplRes.templates || {};
    const broadcasts = histRes.broadcasts || [];
    const recentEmails = histRes.recentEmails || [];
    const aiProvider = tmplRes.aiProvider || 'none';

    main.innerHTML = `
      <h2 style="margin-bottom:4px">📧 Email Broadcast Center</h2>
      <p style="color:var(--muted);margin-bottom:24px">Send emails to all users, specific groups, or individuals — with AI-generated content</p>

      <div class="panel" style="margin-bottom:20px;padding:14px 20px;display:flex;align-items:center;gap:12px">
        <span style="font-size:1.3rem">🤖</span>
        <div>
          <b>AI Email Assistant:</b> <span style="color:${aiProvider==='none'?'var(--warn)':'var(--accent2)'}">${aiProvider}</span>
          ${aiProvider === 'none' ? '<br><span style="color:var(--muted);font-size:.82rem">Set GEMINI_API_KEY or OPENAI_API_KEY to enable AI-generated emails. Template emails still work without AI.</span>' : ''}
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
        <!-- Left: Email Composer -->
        <div class="panel" style="padding:20px">
          <h3 style="margin-bottom:16px">✏️ Compose Email</h3>

          <label style="display:block;margin-bottom:6px;font-size:.85rem;font-weight:600">1. Choose Template Type</label>
          <select id="emailType" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:12px" onchange="onTemplateChange()">
            <option value="">— Select a template —</option>
            ${Object.entries(templates).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join('')}
          </select>
          <p id="templateDesc" style="color:var(--muted);font-size:.82rem;margin:-6px 0 14px;min-height:18px"></p>

          <label style="display:block;margin-bottom:6px;font-size:.85rem;font-weight:600">2. Context / Instructions (optional)</label>
          <textarea id="emailContext" placeholder="e.g., Student on 3-installment plan, paid 1 of 3, seems to have stopped logging in..." style="width:100%;min-height:70px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:12px;font-family:inherit;resize:vertical"></textarea>

          <button class="btn btn-primary" style="width:100%;margin-bottom:20px" id="aiDraftBtn" onclick="aiGenerateEmail()">
            🤖 Generate Email with AI
          </button>

          <label style="display:block;margin-bottom:6px;font-size:.85rem;font-weight:600">3. Subject Line</label>
          <input type="text" id="emailSubject" placeholder="Email subject..." style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:12px">

          <label style="display:block;margin-bottom:6px;font-size:.85rem;font-weight:600">4. Email Body <span style="color:var(--muted);font-weight:400">(use {name} for personalization)</span></label>
          <textarea id="emailBody" placeholder="Write your email here..." style="width:100%;min-height:180px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:12px;font-family:inherit;resize:vertical"></textarea>
        </div>

        <!-- Right: Recipients + Send -->
        <div class="panel" style="padding:20px">
          <h3 style="margin-bottom:16px">📬 Recipients</h3>

          <label style="display:block;margin-bottom:6px;font-size:.85rem;font-weight:600">Send To</label>
          <select id="recipientFilter" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:14px" onchange="onRecipientFilterChange()">
            <option value="all">All Users (${broadcastState.users.length})</option>
            <option value="training_active">Active Training Students (${broadcastState.users.filter(u=>u.activeTraining>0).length})</option>
            <option value="training_installment">On Installment Plans (${broadcastState.users.filter(u=>u.onInstallment).length})</option>
            <option value="training_completed">Completed Training (${broadcastState.users.filter(u=>u.completedTraining>0).length})</option>
            <option value="no_orders">Users With No Orders (${broadcastState.users.filter(u=>u.orderCount===0).length})</option>
            <option value="individual">Individual User (pick below)</option>
          </select>

          <div id="individualPicker" style="display:none;margin-bottom:14px">
            <label style="display:block;margin-bottom:6px;font-size:.85rem;font-weight:600">Select User</label>
            <select id="individualUser" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)">
              ${broadcastState.users.map(u => `<option value="${u.id}">${esc(u.name)} — ${esc(u.email)}${u.onInstallment?' ⚡':''}${u.activeTraining>0?' 🎓':''}</option>`).join('')}
            </select>
          </div>

          <div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:14px;font-size:.85rem">
            <b>Recipient Preview:</b><br>
            <span id="recipientPreview" style="color:var(--muted)">All non-admin users (${broadcastState.users.length})</span>
          </div>

          <button class="btn btn-primary" style="width:100%;font-size:1.05rem;padding:14px" onclick="sendBroadcast()">
            📤 Send Email
          </button>

          <div id="sendResult" style="margin-top:14px"></div>
        </div>
      </div>

      <!-- Email History -->
      <div class="panel" style="padding:0;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <h3 style="margin:0">📊 Email History</h3>
        </div>
        ${broadcasts.length === 0 ? '<p style="padding:30px;text-align:center;color:var(--muted)">No broadcasts sent yet</p>' : `
          <table style="width:100%;border-collapse:collapse;font-size:.85rem">
            <thead><tr style="background:var(--bg);text-align:left">
              <th style="padding:10px 16px">Subject</th>
              <th style="padding:10px 16px">Recipients</th>
              <th style="padding:10px 16px">Filter</th>
              <th style="padding:10px 16px">Sent By</th>
              <th style="padding:10px 16px">Date</th>
            </tr></thead>
            <tbody>
              ${broadcasts.map(b => `
                <tr style="border-bottom:1px solid var(--border)">
                  <td style="padding:10px 16px"><b>${esc(b.subject||'')}</b></td>
                  <td style="padding:10px 16px">${b.recipientCount}</td>
                  <td style="padding:10px 16px"><span style="font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)">${b.filter||'all'}</span></td>
                  <td style="padding:10px 16px">${esc(b.sentBy||'')}</td>
                  <td style="padding:10px 16px;color:var(--muted);font-size:.8rem">${new Date(b.sentAt).toLocaleString()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      </div>

      <!-- Recent Individual Emails -->
      <div class="panel" style="margin-top:20px;padding:0;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <h3 style="margin:0">📬 Recent Emails Sent</h3>
        </div>
        ${recentEmails.length === 0 ? '<p style="padding:30px;text-align:center;color:var(--muted)">No emails sent yet</p>' : `
          <div style="max-height:300px;overflow-y:auto">
            ${recentEmails.map(e => `
              <div style="padding:10px 20px;border-bottom:1px solid var(--border);font-size:.85rem">
                <div style="display:flex;justify-content:space-between">
                  <span><b>${esc(e.subject||'')}</b></span>
                  <span style="padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;text-transform:uppercase;background:${e.status==='sent'?'rgba(0,255,163,.12)':e.status==='logged_only'?'rgba(255,179,71,.12)':'rgba(255,71,87,.12)'};color:${e.status==='sent'?'var(--accent2)':e.status==='logged_only'?'var(--warn)':'var(--danger)'}">${e.status||'queued'}</span>
                </div>
                <div style="color:var(--muted);font-size:.8rem">To: ${esc(e.to||'')} · ${new Date(e.at).toLocaleString()}</div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
  } catch (e) {
    main.innerHTML = `<div style="text-align:center;padding:60px"><h2>Error</h2><p style="color:var(--muted)">${esc(e.message)}</p></div>`;
  }
}

const TEMPLATE_DESCRIPTIONS = {};
function onTemplateChange() {
  const sel = document.getElementById('emailType');
  const desc = document.getElementById('templateDesc');
  const ctx = document.getElementById('emailContext');
  const type = sel.value;
  if (!type) { desc.textContent = ''; return; }
  // Fetch template info from the state we already loaded
  API.get('/admin/email/templates').then(r => {
    const t = r.templates[type];
    if (t) {
      desc.textContent = t.description;
      if (type === 'custom') {
        ctx.placeholder = 'Describe what you want the email to say...';
      } else {
        ctx.placeholder = 'Optional: Add context about the recipient(s)...';
      }
    }
  });
}

function onRecipientFilterChange() {
  const sel = document.getElementById('recipientFilter');
  const picker = document.getElementById('individualPicker');
  const preview = document.getElementById('recipientPreview');
  const filter = sel.value;
  picker.style.display = filter === 'individual' ? 'block' : 'none';

  if (filter === 'individual') {
    preview.textContent = 'Select a user above';
  } else {
    const labels = {
      all: `All non-admin users (${broadcastState.users.length})`,
      training_active: `Active training students (${broadcastState.users.filter(u=>u.activeTraining>0).length})`,
      training_installment: `Students on installment plans (${broadcastState.users.filter(u=>u.onInstallment).length})`,
      training_completed: `Completed training students (${broadcastState.users.filter(u=>u.completedTraining>0).length})`,
      no_orders: `Users with no orders (${broadcastState.users.filter(u=>u.orderCount===0).length})`
    };
    preview.textContent = labels[filter] || filter;
  }
}

async function aiGenerateEmail() {
  const type = document.getElementById('emailType').value;
  if (!type) { toast('Please select a template type first', 'warn'); return; }
  const context = document.getElementById('emailContext').value;
  const btn = document.getElementById('aiDraftBtn');
  btn.disabled = true; btn.textContent = '🤖 AI is writing...';
  try {
    const res = await API.post('/admin/email/generate', { type, context });
    document.getElementById('emailSubject').value = res.subject || '';
    document.getElementById('emailBody').value = res.body || '';
    toast('✅ AI email draft generated! Review and edit as needed.', 'success');
  } catch (e) {
    toast(e.message || 'Could not generate email', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '🤖 Generate Email with AI';
  }
}

async function sendBroadcast() {
  const filter = document.getElementById('recipientFilter').value;
  const subject = document.getElementById('emailSubject').value;
  const body = document.getElementById('emailBody').value;
  if (!subject || !body) { toast('Subject and body are required', 'warn'); return; }
  const resultDiv = document.getElementById('sendResult');

  if (filter === 'individual') {
    const userId = document.getElementById('individualUser').value;
    if (!userId) { toast('Select a user first', 'warn'); return; }
    resultDiv.innerHTML = '<p style="color:var(--muted)">Sending...</p>';
    try {
      const res = await API.post('/admin/email/send-one', { userId, subject, body });
      resultDiv.innerHTML = `<div style="padding:12px;border-radius:8px;background:rgba(0,255,163,.1);color:var(--accent2)"><b>✅ Sent!</b> Email to ${res.email} (status: ${res.status})</div>`;
      toast('Email sent successfully!', 'success');
    } catch (e) {
      resultDiv.innerHTML = `<div style="padding:12px;border-radius:8px;background:rgba(255,71,87,.1);color:var(--danger)"><b>❌ Error:</b> ${esc(e.message)}</div>`;
    }
  } else {
    resultDiv.innerHTML = '<p style="color:var(--muted)">Sending broadcast...</p>';
    try {
      const res = await API.post('/admin/email/broadcast', { subject, body, filter });
      resultDiv.innerHTML = `<div style="padding:12px;border-radius:8px;background:rgba(0,255,163,.1);color:var(--accent2)"><b>✅ Broadcast sent!</b> ${res.sent} emails queued.</div>`;
      toast(`Broadcast sent to ${res.sent} users!`, 'success');
    } catch (e) {
      resultDiv.innerHTML = `<div style="padding:12px;border-radius:8px;background:rgba(255,71,87,.1);color:var(--danger)"><b>❌ Error:</b> ${esc(e.message)}</div>`;
    }
  }
}

renderView();
</script>
</body>
</html>
