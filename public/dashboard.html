<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — CreatiHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="stylesheet" href="/css/style.css">
<script async src="https://js.paystack.co/v2/inline.js"></script>
  <script src="/js/sentry-config.js"></script>
</head>
<body>
<div class="container">
  <div class="dash">
    <aside class="dash-side">
      <div class="dash-side-head">
        <div class="logo" style="font-size:1.15rem">✦ <span>CreatiHub</span></div>
        <div class="bell-wrap" id="userBellWrap" title="Notifications" style="cursor:pointer;position:relative">
          🔔<span class="bell-badge" id="userBellBadge" style="display:none">0</span>
        </div>
      </div>
      <a href="#orders" class="active" data-view="orders">📦 My Orders</a>
      <a href="#subs" data-view="subs">🔁 Subscriptions</a>
      <a href="#new" data-view="new">🛍️ New Order</a>
      <a href="#referrals" data-view="referrals">🎁 Referrals <span class="bell-badge" id="referralBadge" style="position:static;margin-left:4px;display:none"></span></a>
      <a href="#profile" data-view="profile">👤 Profile</a>
      <a href="#security" data-view="security">🔐 Security</a>
    </aside>
    <main class="dash-main" id="dashMain"><div class="empty">Loading…</div></main>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
renderNav('dashboard');
renderFooter();
initChatWidget();

const user = API.user();
if (!user) location.href = '/auth?next=' + encodeURIComponent('/dashboard');
if (user && user.role === 'admin') location.href = '/admin';

const main = document.getElementById('dashMain');
const sideLinks = document.querySelectorAll('.dash-side a');
let view = location.hash.slice(1) || 'orders';

sideLinks.forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  view = a.dataset.view;
  location.hash = view;
  renderView();
}));

async function renderView() {
  sideLinks.forEach(a => a.classList.toggle('active', a.dataset.view === view));
  if (view === 'orders') return renderOrders();
  if (view === 'subs') return renderSubscriptions();
  if (view === 'new') return renderNew();
  if (view === 'referrals') return renderReferrals();
  if (view === 'profile') return renderProfile();
  if (view === 'security') return renderSecurity();
}

async function renderOrders() {
  main.innerHTML = `
    <div class="page-head"><h2>📦 My Orders</h2><a href="/services" class="btn btn-primary btn-sm">+ New Order</a></div>
    <div id="ordersList"><div class="empty">Loading orders…</div></div>`;
  try {
    const { orders } = await API.get('/orders');
    const list = document.getElementById('ordersList');
    if (!orders.length) {
      list.innerHTML = `<div class="empty"><div class="big">🛒</div>No orders yet.<br><br><a href="/services" class="btn btn-primary">Browse Services</a></div>`;
      return;
    }
    list.innerHTML = orders.map(o => {
      const hasDeliverables = (o.deliverables || []).length > 0;
      const canRequestRevision = o.paymentStatus === 'paid' && (o.status === 'in_progress' || o.status === 'completed' || hasDeliverables);
      const canReview = o.status === 'completed' && !o.rating;
      const revisions = o.revisions || [];
      const isManual = o.fulfillmentMode === 'manual';
      return `
      <div class="order-card">
        <div class="order-top">
          <span class="oid">${o.id}</span>
          <span class="badge badge-${o.status}">${o.status.replace('_', ' ')}</span>
          ${o.paymentStatus === 'paid'
            ? '<span class="badge badge-paid">💳 paid' + (o.paymentChannel ? ' · ' + esc(o.paymentChannel) : '') + '</span>'
            : '<span class="badge badge-unpaid">⚠️ unpaid</span>'}
        </div>
        <div class="order-svc">${esc(o.serviceName)} — ${esc(o.packageName)} package</div>
        <div style="color:var(--muted);font-size:.85rem;margin-top:4px">${fmt(o.price)} • Paystack${o.paymentReference ? ' • ref ' + esc(o.paymentReference) : ''} • ${timeAgo(o.createdAt)}${o.coupon ? ' • Coupon: ' + esc(o.coupon.code) + ' (-' + o.discountPct + '%)' : ''}</div>
        ${o.requirements ? `<div class="order-req">📝 ${esc(o.requirements)}</div>` : ''}
        ${o.paymentStatus !== 'paid' && o.status !== 'cancelled' ? `
          <div class="pay-banner">
            <span>⚠️ This order is waiting for payment.</span>
            <button class="btn btn-primary btn-sm" data-pay="${o.id}">Pay now with Paystack →</button>
          </div>` : ''}
        <div class="deliverables-panel" id="del_${o.id}" data-order="${o.id}" data-fulfillment="${isManual ? 'manual' : 'auto'}" data-svc="${esc(o.serviceName)}"></div>
        ${revisions.length ? renderRevisionHistory(revisions) : ''}
        ${canRequestRevision ? renderRevisionForm(o.id) : ''}
        ${canReview ? renderReviewForm(o.id) : ''}
        ${o.rating ? renderReviewDisplay(o) : ''}
        <div class="timeline">
          ${o.timeline.map(t => `<div class="tl-item"><b>${t.status.replace('_', ' ')}</b> — ${esc(t.note)} <span style="opacity:.7">(${timeAgo(t.at)})</span></div>`).join('')}
        </div>
      </div>`;
    }).join('');
    // Fetch + render deliverables for each order (in parallel)
    loadDeliverablesForOrders(orders);
    // Wire revision + review forms
    wireRevisionForms(orders);
    wireReviewForms(orders);
    // Wire "Pay now" buttons — re-initializes a Paystack transaction for the order
    list.querySelectorAll('button[data-pay]').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span> Opening checkout…';
      try {
        const { order, payment } = await API.post('/orders/' + btn.dataset.pay + '/repay');
        if (payment.demo) {
          location.href = '/payment/callback?reference=' + encodeURIComponent(payment.reference) + '&demo=1';
          return;
        }
        const user = API.user();
        if (window.PaystackPop && payment.publicKey) {
          const popup = new PaystackPop();
          popup.newTransaction({
            key: payment.publicKey,
            email: user.email,
            amount: payment.amount,
            currency: payment.currency,
            reference: payment.reference,
            onSuccess: async (txn) => {
              try { await API.get('/payments/verify/' + encodeURIComponent(txn.reference || payment.reference)); } catch {}
              toast('Payment confirmed!');
              renderOrders();
            },
            onCancel: () => { btn.disabled = false; btn.textContent = 'Pay now with Paystack →'; }
          });
        } else if (payment.authorizationUrl) {
          location.href = payment.authorizationUrl;
        }
      } catch (e) {
        toast('Error: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Pay now with Paystack →';
      }
    }));
  } catch (e) {
    document.getElementById('ordersList').innerHTML = '<div class="empty">Failed to load orders.</div>';
  }
}

// Fetch deliverables for each rendered order and inject a download panel.
// Only paid orders that have been processed by the AI engine will have files.
// For orders in manual fulfillment mode (no AI deliverable), show a friendly
// "Processing" panel so the customer knows work is underway.
async function loadDeliverablesForOrders(orders) {
  const fileIcon = (k) => ({ image:'🖼️', audio:'🎵', video:'🎬', text:'📄', html:'🌐', archive:'🗂️', file:'📎' }[k] || '📎');
  for (const o of orders) {
    const slot = document.getElementById('del_' + o.id);
    if (!slot) continue;
    const isManual = o.fulfillmentMode === 'manual' || slot.dataset.fulfillment === 'manual';
    try {
      const { deliverables } = await API.get('/orders/' + o.id + '/deliverables');
      if (!deliverables || !deliverables.length) {
        // No deliverables yet. If this is a manual-fulfillment order (paid),
        // show a reassuring "Processing" panel instead of a blank space.
        if (isManual && o.paymentStatus === 'paid') {
          slot.innerHTML = `
            <div class="del-box" style="border:1px dashed var(--accent);background:linear-gradient(135deg,rgba(124,58,237,0.04),rgba(6,182,212,0.04));padding:18px;border-radius:12px">
              <div style="display:flex;align-items:center;gap:12px">
                <div style="font-size:1.6rem">🎨</div>
                <div>
                  <div style="font-weight:700;font-size:1rem;color:var(--text)">Your order is being crafted ✨</div>
                  <div style="color:var(--muted);font-size:.85rem;margin-top:3px">Our creative team is hand-crafting your <b>${esc(o.serviceName)}</b>. You'll get an email the moment it's ready — usually within 24–48 hours.</div>
                </div>
              </div>
              <div style="margin-top:14px;display:flex;align-items:center;gap:8px;color:var(--accent);font-size:.82rem;font-weight:600">
                <span class="spin" style="width:14px;height:14px;border-width:2px"></span> In progress — no action needed from you
              </div>
            </div>`;
        } else {
          slot.innerHTML = '';
        }
        continue;
      }
      const totalFiles = deliverables.reduce((n, r) => n + (r.items || []).length, 0);
      // If this was a manual order that now has deliverables, show a "ready" banner
      const readyBanner = isManual ? `<div style="background:#16a34a18;border:1px solid #16a34a44;border-radius:10px;padding:10px 14px;margin-bottom:12px;color:#16a34a;font-size:.88rem;font-weight:600">🎉 Your deliverable is ready! Download below.</div>` : '';
      slot.innerHTML = `
        ${readyBanner}
        <div class="del-box">
          <div class="del-head">📦 Your Deliverables <span class="del-count">${totalFiles} file${totalFiles>1?'s':''} ready</span></div>
          ${deliverables.map(run => `
            <div class="del-run">
              <div class="del-run-meta">Generated ${new Date(run.at).toLocaleString()} <span class="del-mode del-mode-${run.mode}">${run.mode}</span></div>
              ${(run.items||[]).map(f => `
                <a class="del-file" onclick="downloadDeliverable('${o.id}','${run.runId}','${f.id}','${esc(f.filename)}')" style="cursor:pointer">
                  <span class="del-file-ic">${fileIcon(f.kind)}</span>
                  <span class="del-file-name">${esc(f.filename)}</span>
                  <span class="del-file-dl">Download ↓</span>
                </a>
                ${f.summary ? `<div class="del-file-sum">${esc(f.summary)}</div>` : ''}
                ${(f.kind==='image'||f.kind==='video'||f.kind==='audio') ? `${f.kind==='image'?'<img data-cprev="1" data-order="'+o.id+'" data-run="'+run.runId+'" id="cdel_'+f.id+' style="max-width:100%;max-height:280px;border-radius:8px;margin:6px 0;display:block" alt="'+esc(f.filename)+'">':f.kind==='video'?'<video data-cprev="1" data-order="'+o.id+'" data-run="'+run.runId+'" id="cdel_'+f.id+' controls style="max-width:100%;border-radius:8px;margin:6px 0;display:block"></video>':'<audio data-cprev="1" data-order="'+o.id+'" data-run="'+run.runId+'" id="cdel_'+f.id+' controls style="width:100%;margin:6px 0"></audio>'}` : ''}
              `).join('')}
            </div>
          `).join('')}
        </div>`;
      scanCustPreviews();
    } catch (e) {
      // Fallback: if the API call fails but we know it's a manual order, show processing
      if (isManual && o.paymentStatus === 'paid') {
        slot.innerHTML = `<div class="del-box" style="border:1px dashed var(--accent);padding:14px;border-radius:12px;color:var(--muted);font-size:.88rem">🎨 Your <b>${esc(o.serviceName)}</b> is being crafted. You'll be notified when it's ready.</div>`;
      } else {
        slot.innerHTML = '';
      }
    }
  }
}

async function downloadDeliverable(orderId, runId, fileId, filename) {
  try {
    await API.download('/orders/' + orderId + '/deliverables/' + runId + '/' + fileId, filename);
  } catch (e) {
    alert('Download failed: ' + e.message);
  }
}

// Load inline preview for images/videos/audio in customer deliverables
async function loadCustPreview(fileId, orderId, runId) {
  try {
    const headers = {};
    if (API.token()) headers['x-token'] = API.token();
    const res = await fetch('/api/orders/' + orderId + '/deliverables/' + runId + '/' + fileId, { headers });
    if (!res.ok) return;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const el = document.getElementById('cdel_' + fileId);
    if (el) { el.src = url; el.style.display = 'block'; }
  } catch (e) { }
}

// Scan DOM for customer preview elements and load them
function scanCustPreviews() {
  document.querySelectorAll('[data-cprev="1"]').forEach(el => {
    if (el.dataset.loaded) return;
    el.dataset.loaded = '1';
    const fid = el.id.replace('cdel_', '');
    loadCustPreview(fid, el.dataset.order, el.dataset.run);
  });
}

// Render revision history for an order
function renderRevisionHistory(revisions) {
  const statusColors = { pending:'#d97706', accepted:'#2563eb', regenerated:'#16a34a', rejected:'#dc2626', completed:'#16a34a' };
  return `
    <div class="rev-history">
      <div style="font-weight:700;font-size:.88rem;margin-bottom:6px">🔄 Revision History (${revisions.length})</div>
      ${revisions.map(r => `
        <div class="rev-history-item">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span class="rev-status-badge" style="background:${(statusColors[r.status]||'#6b7280')}22;color:${statusColors[r.status]||'#6b7280'}">${esc(r.status)}</span>
            <span style="color:var(--muted);font-size:.76rem">${new Date(r.requestedAt || r.at).toLocaleDateString()}</span>
          </div>
          <div style="margin:4px 0"><b>Your note:</b> ${esc(r.note || '')}</div>
          ${r.response ? `<div style="margin:4px 0"><b>Admin response:</b> ${esc(r.response)}</div>` : ''}
        </div>
      `).join('')}
    </div>`;
}

// Render revision request form
function renderRevisionForm(orderId) {
  return `
    <div class="rev-form" id="revForm_${orderId}">
      <h4>🔄 Request a Revision</h4>
      <p style="color:var(--muted);font-size:.84rem;margin:0 0 8px">Not quite right? Tell us what to change and we'll regenerate your deliverables.</p>
      <textarea id="revTxt_${orderId}" placeholder="Describe what you'd like changed — e.g. 'Make the logo blue instead of red' or 'Shorten the voiceover to 30 seconds'"></textarea>
      <div class="rev-actions">
        <button class="btn btn-primary btn-sm" data-rev-submit="${orderId}">Submit Revision Request</button>
      </div>
      <div id="revMsg_${orderId}"></div>
    </div>`;
}

// Render review form (star rating + text)
function renderReviewForm(orderId) {
  return `
    <div class="rev-form" id="reviewForm_${orderId}" style="border-color:#f59e0b44;background:#fffbeb">
      <h4>⭐ Rate Your Experience</h4>
      <p style="color:var(--muted);font-size:.84rem;margin:0 0 10px">How did we do? Your feedback helps other customers.</p>
      <div class="star-rating" id="starRating_${orderId}">
        <input type="radio" name="rating_${orderId}" id="star5_${orderId}" value="5"><label for="star5_${orderId}">★</label>
        <input type="radio" name="rating_${orderId}" id="star4_${orderId}" value="4"><label for="star4_${orderId}">★</label>
        <input type="radio" name="rating_${orderId}" id="star3_${orderId}" value="3"><label for="star3_${orderId}">★</label>
        <input type="radio" name="rating_${orderId}" id="star2_${orderId}" value="2"><label for="star2_${orderId}">★</label>
        <input type="radio" name="rating_${orderId}" id="star1_${orderId}" value="1"><label for="star1_${orderId}">★</label>
      </div>
      <textarea id="reviewTxt_${orderId}" placeholder="Share your experience with this service..." style="margin-top:10px"></textarea>
      <div class="rev-actions">
        <button class="btn btn-primary btn-sm" data-review-submit="${orderId}">Submit Review</button>
      </div>
      <div id="reviewMsg_${orderId}"></div>
    </div>`;
}

// Render existing review display
function renderReviewDisplay(o) {
  const stars = '★'.repeat(o.rating) + '<span style="color:#d1d5db">' + '★'.repeat(5 - o.rating) + '</span>';
  return `
    <div class="review-card" style="margin-top:12px">
      <div class="rev-head">
        <span class="rev-stars">${stars}</span>
        <span class="rev-date">${o.reviewedAt ? new Date(o.reviewedAt).toLocaleDateString() : ''}</span>
      </div>
      ${o.review ? `<div class="rev-text">${esc(o.review)}</div>` : ''}
      <div class="rev-svc">Your review for ${esc(o.serviceName)}</div>
    </div>`;
}

// Wire up revision form submit buttons
function wireRevisionForms(orders) {
  document.querySelectorAll('button[data-rev-submit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const oid = btn.dataset.revSubmit;
      const txt = document.getElementById('revTxt_' + oid).value.trim();
      const msg = document.getElementById('revMsg_' + oid);
      if (!txt) { msg.innerHTML = '<div class="form-error">Please describe what you\'d like changed.</div>'; return; }
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Submitting…';
      try {
        await API.post('/orders/' + oid + '/revisions', { note: txt });
        msg.innerHTML = '<div class="form-ok">✅ Revision request submitted! We\'ll review and regenerate your deliverables.</div>';
        toast('Revision request sent!');
        setTimeout(() => renderOrders(), 1500);
      } catch (e) {
        msg.innerHTML = '<div class="form-error">' + esc(e.message) + '</div>';
        btn.disabled = false; btn.textContent = 'Submit Revision Request';
      }
    });
  });
}

// Wire up review form submit buttons
function wireReviewForms(orders) {
  document.querySelectorAll('button[data-review-submit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const oid = btn.dataset.reviewSubmit;
      const ratingInput = document.querySelector(`input[name="rating_${oid}"]:checked`);
      const reviewText = document.getElementById('reviewTxt_' + oid).value.trim();
      const msg = document.getElementById('reviewMsg_' + oid);
      if (!ratingInput) { msg.innerHTML = '<div class="form-error">Please select a star rating.</div>'; return; }
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Submitting…';
      try {
        await API.post('/orders/' + oid + '/review', { rating: parseInt(ratingInput.value), review: reviewText });
        msg.innerHTML = '<div class="form-ok">🎉 Thank you for your review!</div>';
        toast('Review submitted!');
        setTimeout(() => renderOrders(), 1500);
      } catch (e) {
        msg.innerHTML = '<div class="form-error">' + esc(e.message) + '</div>';
        btn.disabled = false; btn.textContent = 'Submit Review';
      }
    });
  });
}

async function renderSubscriptions() {
  main.innerHTML = `
    <div class="page-head"><h2>🔁 My Subscriptions</h2>
    <a href="/services#retainers" class="btn btn-primary btn-sm">Browse Retainer Plans →</a></div>
    <div id="subsList"><div class="empty">Loading subscriptions…</div></div>`;
  try {
    const { subscriptions } = await API.get('/subscriptions');
    const list = document.getElementById('subsList');
    if (!subscriptions.length) {
      list.innerHTML = `<div class="empty">You have no active subscriptions yet.<br><br><a href="/services#retainers" class="btn btn-primary btn-sm">View Monthly Retainers →</a></div>`;
      return;
    }
    list.innerHTML = subscriptions.map(s => {
      const statusColor = { active: '#16a34a', pending: '#d97706', cancelled: '#dc2626' }[s.status] || 'var(--muted)';
      const period = s.currentPeriodEnd ? `<div style="color:var(--muted);font-size:.82rem;margin-top:6px">Next billing: ${new Date(s.currentPeriodEnd).toLocaleDateString()}</div>` : '';
      const cancelBtn = s.status !== 'cancelled'
        ? `<button class="btn btn-ghost btn-sm" onclick="cancelSub('${s.id}')">Cancel Subscription</button>`
        : '<span style="color:var(--muted);font-size:.85rem">Cancelled</span>';
      return `
        <div class="svc-card" style="margin-bottom:16px">
          <div class="svc-body" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
            <div>
              <h3 style="margin:0">${esc(s.planName)}</h3>
              <div style="margin-top:4px"><span class="price">${fmt(s.planPrice)}<span style="font-size:.8rem;color:var(--muted)">/${s.interval}</span></span>
              <span style="margin-left:12px;font-weight:600;color:${statusColor};text-transform:capitalize">${s.status}</span></div>
              ${period}
              <div style="color:var(--muted);font-size:.82rem;margin-top:4px">Started ${new Date(s.startedAt).toLocaleDateString()} · Ref ${s.reference}</div>
            </div>
            <div>${cancelBtn}</div>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('subsList').innerHTML = '<div class="empty">Failed to load subscriptions.</div>';
  }
}

async function cancelSub(id) {
  if (!confirm('Cancel this subscription? You will keep access until the end of the current billing period.')) return;
  try {
    await API.post('/subscriptions/' + id + '/cancel');
    renderSubscriptions();
  } catch (e) {
    alert('Could not cancel: ' + (e.message || 'Unknown error'));
  }
}

async function renderNew() {
  main.innerHTML = `
    <div class="page-head"><h2>🛍️ Start a New Order</h2></div>
    <div class="grid grid-3" id="newGrid"><div class="empty">Loading…</div></div>`;
  try {
    const { services } = await API.get('/services?currency=' + getCurrency());
    document.getElementById('newGrid').innerHTML = services.map(s => `
      <div class="svc-card">
        <div class="thumb"><img src="${s.image}" loading="lazy" alt="${esc(s.name)}"><span class="cat">${esc(s.category)}</span></div>
        <div class="svc-body">
          <h3>${s.icon} ${esc(s.name)}</h3>
          <p class="tag">${esc(s.tagline)}</p>
          <div class="svc-meta"><span class="price">from ${fmt(s.packages[0].price)}</span><span class="rating">★ ${s.rating}</span></div>
          <a href="/order?service=${s.id}" class="btn btn-primary btn-sm mt-2" style="width:100%">Order →</a>
        </div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('newGrid').innerHTML = '<div class="empty">Failed to load services.</div>';
  }
}

function renderProfile() {
  main.innerHTML = `
    <div class="page-head"><h2>👤 My Profile</h2></div>
    <div class="panel" style="max-width:520px">
      <div class="field"><label>Name</label><input value="${esc(user.name)}" disabled></div>
      <div class="field"><label>Email</label><input value="${esc(user.email)}" disabled></div>
      <div class="field"><label>Preferred currency</label>
        <select id="profCur">${CURRENCIES.map(c => `<option ${c === getCurrency() ? 'selected' : ''}>${c}</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" id="saveCur">Save Preferences</button>
      <p style="color:var(--muted);font-size:.85rem;margin-top:16px">Member since ${new Date(user.createdAt).toLocaleDateString()}</p>
    </div>`;
  document.getElementById('saveCur').addEventListener('click', async () => {
    const c = document.getElementById('profCur').value;
    setCurrency(c);
    try { await API.put('/me/currency', { currency: c }); toast('Preferences saved!'); } catch { toast('Saved locally'); }
  });
}

// ---------------- Security: reset login details anytime ----------------
function renderSecurity() {
  main.innerHTML = `
    <div class="page-head"><h2>🔐 Login & Security</h2></div>
    <p style="color:var(--muted);margin-bottom:22px;max-width:640px">You can reset your login details at any time. Changing your password signs out all your other devices automatically.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start" class="sec-grid">
      <div class="panel">
        <h3>🔑 Change Password</h3>
        <div id="pwMsg"></div>
        <form id="pwForm">
          <div class="field"><label>Current password</label><input id="curPw" type="password" required autocomplete="current-password"></div>
          <div class="field"><label>New password</label><input id="newPw" type="password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password"></div>
          <div class="field"><label>Confirm new password</label><input id="newPw2" type="password" required minlength="6" autocomplete="new-password"></div>
          <button class="btn btn-primary" style="width:100%" id="pwBtn">Update Password</button>
        </form>
      </div>
      <div class="panel">
        <h3>✉️ Change Login Email</h3>
        <div id="emMsg"></div>
        <form id="emForm">
          <div class="field"><label>Current email</label><input value="${esc(user.email)}" disabled></div>
          <div class="field"><label>New email</label><input id="newEm" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label>Confirm with password</label><input id="emPw" type="password" required autocomplete="current-password"></div>
          <button class="btn btn-primary" style="width:100%" id="emBtn">Update Email</button>
        </form>
        <p style="color:var(--muted);font-size:.82rem;margin-top:16px">💡 Forgot your current password? <a href="/auth?mode=reset" style="color:var(--accent)">Reset it here</a> with a code sent to your email.</p>
      </div>
    </div>
    <style>@media(max-width:860px){.sec-grid{grid-template-columns:1fr!important}}</style>`;

  // Change password
  document.getElementById('pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const m = document.getElementById('pwMsg');
    const btn = document.getElementById('pwBtn');
    const cur = document.getElementById('curPw').value;
    const nw = document.getElementById('newPw').value;
    const nw2 = document.getElementById('newPw2').value;
    m.innerHTML = '';
    if (nw !== nw2) { m.innerHTML = '<div class="form-error">New passwords do not match.</div>'; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Updating…';
    try {
      const res = await API.put('/me/password', { currentPassword: cur, newPassword: nw });
      m.innerHTML = '<div class="form-ok">' + esc(res.message) + '</div>';
      document.getElementById('pwForm').reset();
      toast('Password updated!');
    } catch (err) {
      m.innerHTML = '<div class="form-error">' + esc(err.message) + '</div>';
    }
    btn.disabled = false; btn.textContent = 'Update Password';
  });

  // Change email
  document.getElementById('emForm').addEventListener('submit', async e => {
    e.preventDefault();
    const m = document.getElementById('emMsg');
    const btn = document.getElementById('emBtn');
    m.innerHTML = '';
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Updating…';
    try {
      const res = await API.put('/me/email', {
        newEmail: document.getElementById('newEm').value,
        password: document.getElementById('emPw').value
      });
      API.setSession(API.token(), res.user); // update stored user
      m.innerHTML = '<div class="form-ok">' + esc(res.message) + ' — you\'ll use it next time you log in.</div>';
      toast('Login email updated!');
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      m.innerHTML = '<div class="form-error">' + esc(err.message) + '</div>';
      btn.disabled = false; btn.textContent = 'Update Email';
    }
  });
}

// ── Phase 8: Referral Campaign ────────────────────────────────────
async function renderReferrals() {
  main.innerHTML = '<div class="empty">Loading your referral dashboard…</div>';
  try {
    const data = await API.get('/referrals/my-code');
    const s = data.stats;
    const fmtNaira = n => '₦' + Number(n).toLocaleString();

    main.innerHTML = `
      <div style="margin-bottom:20px">
        <h2 style="margin:0 0 6px">🎁 Referral Program</h2>
        <p style="color:var(--muted);font-size:.9rem;margin:0">Earn ${fmtNaira(data.bountyPerReferral)} for every person you refer who places their first order.</p>
      </div>

      <div class="panel" style="margin-bottom:20px;padding:24px">
        <label style="font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Your Referral Code</label>
        <div style="display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap">
          <code id="refCodeDisplay" style="font-size:1.6rem;font-weight:700;color:var(--accent);letter-spacing:.08em;background:var(--bg2);padding:8px 16px;border-radius:8px;border:1px solid var(--border)">${esc(data.referralCode)}</code>
          <button class="btn btn-primary" id="copyCodeBtn" style="padding:8px 16px">📋 Copy Code</button>
          <button class="btn" id="copyLinkBtn" style="padding:8px 16px">🔗 Copy Share Link</button>
          <button class="btn" id="shareBtn" style="padding:8px 16px">📤 Share</button>
        </div>
        <div style="margin-top:12px;padding:12px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <label style="font-size:.82rem;color:var(--muted)">Your referral link:</label>
          <code id="refLinkDisplay" style="display:block;margin-top:4px;font-size:.85rem;word-break:break-all;color:var(--accent)">${esc(data.shareLink)}</code>
        </div>
        <p style="margin-top:12px;font-size:.85rem;color:var(--muted);line-height:1.6">
          Share your code or link with friends. When they register and place their first order, you earn ${fmtNaira(data.bountyPerReferral)}. You'll be notified the moment it happens!
        </p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">
        <div class="panel" style="text-align:center;padding:16px">
          <div style="font-size:1.8rem;font-weight:700;color:var(--accent)">${s.totalReferred}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:4px">People Referred</div>
        </div>
        <div class="panel" style="text-align:center;padding:16px">
          <div style="font-size:1.8rem;font-weight:700;color:var(--accent)">${s.totalOrdered}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:4px">First Orders Placed</div>
        </div>
        <div class="panel" style="text-align:center;padding:16px">
          <div style="font-size:1.8rem;font-weight:700;color:#22c55e">${fmtNaira(s.totalEarnedBounty)}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:4px">Total Earned</div>
        </div>
        <div class="panel" style="text-align:center;padding:16px">
          <div style="font-size:1.8rem;font-weight:700;color:#f59e0b">${fmtNaira(s.totalPendingBounty)}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:4px">Pending Payout</div>
        </div>
        <div class="panel" style="text-align:center;padding:16px">
          <div style="font-size:1.8rem;font-weight:700;color:#22c55e">${fmtNaira(s.totalPaidBounty)}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:4px">Total Paid</div>
        </div>
      </div>

      <div class="panel" style="padding:0;overflow:hidden">
        <h3 style="padding:16px 20px;margin:0;border-bottom:1px solid var(--border)">Your Referrals</h3>
        ${data.referrals.length === 0
          ? '<div style="padding:32px;text-align:center;color:var(--muted);font-size:.9rem">You haven\'t referred anyone yet. Share your code above to start earning!</div>'
          : `<table class="tbl" style="width:100%">
              <thead>
                <tr>
                  <th style="text-align:left;padding:10px 16px">Person</th>
                  <th style="text-align:left;padding:10px 16px">Status</th>
                  <th style="text-align:left;padding:10px 16px">Bounty</th>
                  <th style="text-align:left;padding:10px 16px">Date</th>
                </tr>
              </thead>
              <tbody>
                ${data.referrals.map(r => {
                  const statusBadge = r.status === 'first_order'
                    ? '<span class="badge badge-in_progress">Ordered</span>'
                    : '<span class="badge badge-pending">Registered</span>';
                  const bountyBadge = r.bountyStatus === 'paid'
                    ? '<span class="badge badge-delivered">Paid</span>'
                    : r.bountyStatus === 'earned'
                    ? '<span class="badge badge-in_progress">Earned — awaiting payout</span>'
                    : '<span class="badge badge-pending">Pending first order</span>';
                  const date = new Date(r.createdAt).toLocaleDateString();
                  return `<tr>
                    <td style="padding:10px 16px">${esc(r.referredName)}</td>
                    <td style="padding:10px 16px">${statusBadge}</td>
                    <td style="padding:10px 16px">${bountyBadge}</td>
                    <td style="padding:10px 16px;color:var(--muted);font-size:.85rem">${date}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>`}
      </div>
    `;

    // Copy code button
    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(data.referralCode).then(() => toast('Referral code copied!'));
    });
    // Copy link button
    document.getElementById('copyLinkBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(data.shareLink).then(() => toast('Share link copied!'));
    });
    // Share button (Web Share API)
    document.getElementById('shareBtn').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'Join CreatiHub',
          text: 'Get professional creative services at CreatiHub! Use my referral code ' + data.referralCode + ' to sign up:',
          url: data.shareLink
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(data.shareLink).then(() => toast('Share link copied! Use any messaging app to share it.'));
      }
    });

  } catch (err) {
    main.innerHTML = '<div class="form-error" style="margin:20px">' + esc(err.message) + '</div>';
  }
}

renderView();

// ── Phase 8: User notification bell ────────────────────────────────
async function loadUserNotifications() {
  try {
    const data = await API.get('/notifications');
    const badge = document.getElementById('userBellBadge');
    const refBadge = document.getElementById('referralBadge');
    if (badge) {
      if (data.unread > 0) {
        badge.textContent = data.unread;
        badge.style.display = '';
      } else {
        badge.style.display = 'none';
      }
    }
    if (refBadge) {
      const refUnread = data.notifications.filter(n => n.type === 'referral' && !n.read).length;
      if (refUnread > 0) {
        refBadge.textContent = refUnread;
        refBadge.style.display = '';
      } else {
        refBadge.style.display = 'none';
      }
    }
  } catch (e) { /* ignore — notifications are non-critical */ }
}

// Show a dropdown of notifications when bell is clicked
const userBellWrap = document.getElementById('userBellWrap');
if (userBellWrap) {
  userBellWrap.addEventListener('click', async () => {
    try {
      const data = await API.get('/notifications');
      if (data.notifications.length === 0) {
        toast('No notifications yet');
        return;
      }
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
      modal.innerHTML = `
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;padding:0">
          <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
            <b>🔔 Notifications</b>
            <button id="closeNotifModal" style="background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer">✕</button>
          </div>
          <div id="notifList">${data.notifications.map(n => `
            <div style="padding:14px 20px;border-bottom:1px solid var(--border)${n.read ? ';opacity:.6' : ''}">
              <div style="font-weight:600;font-size:.9rem">${esc(n.title)}</div>
              <div style="font-size:.82rem;color:var(--muted);margin-top:4px;white-space:pre-wrap">${esc(n.message)}</div>
              <div style="font-size:.75rem;color:var(--muted);margin-top:6px">${new Date(n.at).toLocaleString()}</div>
            </div>
          `).join('')}</div>
          <div style="padding:12px 20px;text-align:right">
            <button class="btn btn-ghost btn-sm" id="markAllReadBtn">Mark all as read</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      modal.querySelector('#closeNotifModal').addEventListener('click', () => modal.remove());
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
      modal.querySelector('#markAllReadBtn').addEventListener('click', async () => {
        try { await API.post('/notifications/read-all', {}); } catch {}
        modal.remove();
        loadUserNotifications();
      });
      try { await API.post('/notifications/read-all', {}); } catch {}
      loadUserNotifications();
    } catch (e) { toast('Could not load notifications'); }
  });
}

loadUserNotifications();
setInterval(loadUserNotifications, 60000);
</script>
</body>
</html>
